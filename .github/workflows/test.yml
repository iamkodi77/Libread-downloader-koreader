name: Test and package plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development runtime
        run: python -m pip install -r requirements-dev.txt
      - name: LuaJIT tests, EPUB inspection, and package checks
        run: python scripts/test.py
      - name: Build installable plugin
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: libread-koplugin
          path: |
            artifacts/libread-koplugin.zip
            artifacts/libread-koplugin.zip.sha256
          if-no-files-found: error
